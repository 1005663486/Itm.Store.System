name: ITM Tickets — Build, Test & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/itm-tickets

jobs:
  # ── Job 1: Tests ─────────────────────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore Itm.Gateway.Api/Itm.Gateway.Api.csproj
          dotnet restore Itm.Inventory.Api/Itm.Inventory.Api.csproj
          dotnet restore Itm.Order.Api/Itm.Order.Api.csproj
          dotnet restore Itm.Price.Api/Itm.Price.Api.csproj
          dotnet restore Itm.Search.Api/Itm.Search.Api.csproj

      - name: Build solution
        run: |
          dotnet build Itm.Gateway.Api/Itm.Gateway.Api.csproj --no-restore -c Release
          dotnet build Itm.Inventory.Api/Itm.Inventory.Api.csproj --no-restore -c Release
          dotnet build Itm.Order.Api/Itm.Order.Api.csproj --no-restore -c Release
          dotnet build Itm.Price.Api/Itm.Price.Api.csproj --no-restore -c Release
          dotnet build Itm.Search.Api/Itm.Search.Api.csproj --no-restore -c Release

      - name: Run tests
        run: dotnet test GestionITM.Tests/Itm.Inventory.Tests.csproj -c Release --verbosity normal


  # ── Job 2: Build & Push imágenes Docker ──────────────────────────────────────
  build-and-push:
    name: Build & push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test                          # Solo corre si los tests pasan
    if: github.ref == 'refs/heads/main'  # Solo en push a main (no en PRs)

    strategy:
      matrix:
        include:
          - service: gateway
            context: .
            dockerfile: Itm.Gateway.Api/Dockerfile
          - service: inventory
            context: .
            dockerfile: Itm.Inventory.Api/Dockerfile
          - service: order
            context: .
            dockerfile: Itm.Order.Api/Dockerfile
          - service: price
            context: .
            dockerfile: Itm.Price.Api/Dockerfile
          - service: search
            context: .
            dockerfile: Itm.Search.Api/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max